server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API servie sous la même adresse que le portail : pas de CORS,
    # et le cookie de session reste sur le même site.
    # "api" = nom du service Docker ; 127.0.0.11 = DNS interne de Docker.
    location /api/ {
        # Dépôt de cours partagés (.mbz, 20 Mo par défaut côté API)
        client_max_body_size 25m;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://tasks.api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache statique court : une nouvelle version est vue après un déploiement
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
