version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharedmoodle
      POSTGRES_USER: smadmin
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Attention : en Swarm, le montage local ./db/init.sql ne fonctionnera que si ce fichier est présent sur le worker2.
      # Il est préférable d'utiliser les Docker Configs pour l'initialisation.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smadmin -d sharedmoodle"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      placement:
        constraints:
          - node.labels.role == db

  api:
    # Swarm nécessite une image pré-construite. Pense à la pousser sur ton compte Docker Hub (ex: kasupremacy/sharedmoodle-api).
    image: kasupremacy/sharedmoodle-api:latest 
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://smadmin:devpassword@postgres:5432/sharedmoodle
      JWT_SECRET: sharedmoodle-local-secret-change-before-production
      DOMAIN: localhost
      MOODLE_URL: http://localhost:8081
      FRONTEND_ORIGINS: http://localhost:8080
    ports:
      - "3000:3000"
    deploy:
      placement:
        constraints:
          - node.labels.role == manager

  frontend:
    image: kasupremacy/sharedmoodle-frontend:latest
    ports:
      - "8080:80"
    deploy:
      placement:
        constraints:
          - node.labels.role == manager

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: moodlepassword
    volumes:
      - mariadb-data:/var/lib/mysql
    deploy:
      placement:
        constraints:
          - node.labels.role == db

  moodle:
    image: bitnami/moodle:latest
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: moodlepassword
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: admin12345
      MOODLE_EMAIL: admin@sharedmoodle.local
      MOODLE_SITE_NAME: SharedMoodle Demo
    ports:
      - "8081:8080"
    volumes:
      - moodle-data:/bitnami/moodle
      - moodle-files:/bitnami/moodledata
    deploy:
      placement:
        constraints:
          - node.labels.role == app

volumes:
  postgres-data:
  mariadb-data:
  moodle-data:
  moodle-files:
