# ============================================================
# SharedMoodle — Stack principale (Portail + Infra)
# Déployer avec : docker stack deploy -c docker-compose.yml sharedmoodle
# ============================================================

networks:
  proxy:
    driver: overlay
    attachable: true
  portal-db:
    driver: overlay
    internal: true

volumes:
  postgres-data:
    driver: local
  traefik-certs:
    driver: local

services:
  # ----------------------------------------------------------
  # Traefik — Reverse Proxy + TLS automatique
  # ----------------------------------------------------------
  traefik:
    image: traefik:v3.1
    command:
      - "--api.dashboard=true"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=sharedmoodle_proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@sharedmoodle.fr"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
    networks:
      - proxy
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        # Dashboard (protégé, accès admin uniquement)
        - "traefik.http.routers.dashboard.rule=Host(`traefik.sharedmoodle.fr`)"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.services.dashboard.loadbalancer.server.port=8080"

  # ----------------------------------------------------------
  # PostgreSQL — Base de données du portail
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharedmoodle
      POSTGRES_USER: smadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - portal-db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == db

  # ----------------------------------------------------------
  # API Backend — Node.js / Express
  # ----------------------------------------------------------
  api:
    image: sharedmoodle/api:latest
    build:
      context: .
      dockerfile: portal/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sharedmoodle
      POSTGRES_USER: smadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DOMAIN: sharedmoodle.fr
      PROVISIONING_MODE: swarm
      NFS_SERVER: ${NFS_SERVER}
      NFS_BASE_PATH: ${NFS_BASE_PATH:-/srv/nfs/sharedmoodle}
    secrets:
      - jwt_secret
      - postgres_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
      - portal-db
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.role == app
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`api.sharedmoodle.fr`)"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.tls.certresolver=letsencrypt"
        - "traefik.http.services.api.loadbalancer.server.port=3000"

  # ----------------------------------------------------------
  # Frontend — Portail client (Nginx + static)
  # ----------------------------------------------------------
  frontend:
    image: sharedmoodle/frontend:latest
    build:
      context: ./portal/frontend
      dockerfile: Dockerfile
    networks:
      - proxy
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.role == app
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portal.rule=Host(`sharedmoodle.fr`) || Host(`www.sharedmoodle.fr`)"
        - "traefik.http.routers.portal.entrypoints=websecure"
        - "traefik.http.routers.portal.tls.certresolver=letsencrypt"
        - "traefik.http.services.portal.loadbalancer.server.port=80"

secrets:
  postgres_password:
    external: true
  jwt_secret:
    external: true
