version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 8080
        published: 8080
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy
    deploy:
      # 1 seule copie : port publié en mode host sur le manager
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == manager

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - target: 9000
        published: 9000
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - proxy
    deploy:
      # 1 seule copie : port publié en mode host sur le manager
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == manager

  frontend:
    image: kasupremacy/sharedmoodle-frontend:latest
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sharedmoodle_net
      - proxy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`portail.sharedmoodle`)"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"
        - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/"
        - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=10s"

  api:
    image: kasupremacy/sharedmoodle-api:latest
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_DB: sharedmoodle
      POSTGRES_USER: smadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/sm_postgres_password
      JWT_SECRET_FILE: /run/secrets/sm_jwt_secret
      DOMAIN: localhost
      MOODLE_URL: http://pau.sharedmoodle
      FRONTEND_ORIGINS: http://portail.sharedmoodle
      MOODLE_DB_HOST: tasks.mariadb
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD_FILE: /run/secrets/sm_moodle_db_password
    secrets:
      - sm_postgres_password
      - sm_jwt_secret
      - sm_moodle_db_password
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - sharedmoodle_net
      - proxy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`api.sharedmoodle`)"
        - "traefik.http.services.api.loadbalancer.server.port=3000"
        - "traefik.http.services.api.loadbalancer.healthcheck.path=/api/health"
        - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"

  moodle:
    image: bitnamilegacy/moodle:latest
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: tasks.mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD_FILE: /run/secrets/sm_moodle_db_password
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD_FILE: /run/secrets/sm_moodle_admin_password
      MOODLE_EMAIL: admin@sharedmoodle.local
      MOODLE_SITE_NAME: SharedMoodle Pau
    secrets:
      - sm_moodle_db_password
      - sm_moodle_admin_password
    volumes:
      - moodle-data:/bitnami/moodle
      - moodle-files:/bitnami/moodledata
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents(\"http://127.0.0.1:8080/login/index.php\", false, stream_context_create([\"http\" => [\"follow_location\" => 0, \"timeout\" => 5]])) === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    networks:
      - sharedmoodle_net
      - proxy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == app
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.moodle.rule=Host(`pau.sharedmoodle`)"
        - "traefik.http.services.moodle.loadbalancer.server.port=8080"
        - "traefik.http.services.moodle.loadbalancer.healthcheck.path=/login/index.php"
        - "traefik.http.services.moodle.loadbalancer.healthcheck.interval=10s"
        # Un utilisateur reste sur la même copie de Moodle pendant sa session
        - "traefik.http.services.moodle.loadbalancer.sticky.cookie=true"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharedmoodle
      POSTGRES_USER: smadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/sm_postgres_password
    secrets:
      - sm_postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      # 1 seule copie : service avec état (une base = un seul écrivain)
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smadmin -d sharedmoodle"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sharedmoodle_net

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/sm_mariadb_root_password
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD_FILE: /run/secrets/sm_moodle_db_password
    secrets:
      - sm_mariadb_root_password
      - sm_moodle_db_password
    volumes:
      - mariadb-data:/var/lib/mysql
    deploy:
      # 1 seule copie : service avec état (une base = un seul écrivain)
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == db
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - sharedmoodle_net

volumes:
  postgres-data:
  mariadb-data:
  moodle-data:
  moodle-files:
  portainer-data:

# Secrets créés une fois sur le manager avec scripts/create-secrets.sh
secrets:
  sm_postgres_password:
    external: true
  sm_jwt_secret:
    external: true
  sm_moodle_db_password:
    external: true
  sm_mariadb_root_password:
    external: true
  sm_moodle_admin_password:
    external: true

networks:
  sharedmoodle_net:
    driver: overlay
  proxy:
    external: true
