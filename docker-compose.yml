version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 8080
        published: 8080
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy
    deploy:
      # 1 seule copie : port publié en mode host sur le manager
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
      # Arrêter l'ancienne avant la nouvelle (port publié en mode host / volume unique)
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == manager

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - target: 9000
        published: 9000
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - proxy
    deploy:
      # 1 seule copie : port publié en mode host sur le manager
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
      # Arrêter l'ancienne avant la nouvelle (port publié en mode host / volume unique)
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == manager

  frontend:
    image: kasupremacy/sharedmoodle-frontend:1.1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sharedmoodle_net
      - proxy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`portail.sharedmoodle`)"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"
        - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/"
        - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=10s"

  api:
    image: kasupremacy/sharedmoodle-api:1.1.0
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_DB: sharedmoodle
      POSTGRES_USER: smadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/sm_postgres_password
      JWT_SECRET_FILE: /run/secrets/sm_jwt_secret
      DOMAIN: localhost
      FRONTEND_ORIGINS: http://portail.sharedmoodle
      # Un Moodle par client, créé par le provisioner (pile sm-<slug>)
      PROVISIONER_URL: http://provisioner:4000
      PROVISIONER_TOKEN_FILE: /run/secrets/sm_provisioner_token
      TENANT_MASTER_KEY_FILE: /run/secrets/sm_tenant_master_key
      TENANT_DOMAIN: sharedmoodle
    secrets:
      - sm_postgres_password
      - sm_jwt_secret
      - sm_provisioner_token
      - sm_tenant_master_key
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - sharedmoodle_net
      - proxy
      - admin
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`api.sharedmoodle`)"
        - "traefik.http.services.api.loadbalancer.server.port=3000"
        - "traefik.http.services.api.loadbalancer.healthcheck.path=/api/health"
        - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"

  # Seul service qui pilote Docker : crée la pile Moodle de chaque client.
  # Pas exposé par Traefik ; appelé par l'API avec un jeton secret.
  provisioner:
    image: kasupremacy/sharedmoodle-provisioner:1.1.0
    environment:
      PROVISIONER_TOKEN_FILE: /run/secrets/sm_provisioner_token
      TENANT_MASTER_KEY_FILE: /run/secrets/sm_tenant_master_key
      TENANT_DOMAIN: sharedmoodle
    secrets:
      - sm_provisioner_token
      - sm_tenant_master_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sharedmoodle_net
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharedmoodle
      POSTGRES_USER: smadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/sm_postgres_password
    secrets:
      - sm_postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      # 1 seule copie : service avec état (une base = un seul écrivain)
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      # Base de données : arrêter l'ancienne avant de lancer la nouvelle (un seul écrivain sur le volume)
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smadmin -d sharedmoodle"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sharedmoodle_net

volumes:
  postgres-data:
  portainer-data:

# Secrets créés une fois sur le manager avec scripts/create-secrets.sh
secrets:
  sm_postgres_password:
    external: true
  sm_jwt_secret:
    external: true
  sm_provisioner_token:
    external: true
  sm_tenant_master_key:
    external: true

networks:
  sharedmoodle_net:
    driver: overlay
  proxy:
    external: true
  # Relie l'API aux bases des établissements (mesure, limites) ; créé ici, utilisé par les piles sm-<slug>
  admin:
    driver: overlay
    attachable: true
    name: sm_admin
