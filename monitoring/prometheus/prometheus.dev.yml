# Prometheus pour le lancement local (docker-compose.dev.yml, profil "monitoring").
# Pas de Swarm : cibles fixes par nom de service Compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: api
    static_configs:
      - targets: ["api:9464"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
