# ============================================================
# Prometheus de SharedMoodle (Swarm) : C1
# Les cibles sont trouvées par le DNS du Swarm : "tasks.<service>"
# renvoie l'adresse de chaque copie (une par nœud pour cadvisor et
# node-exporter, qui tournent en mode global).
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertes envoyées à Alertmanager (Discord, mail)
alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ["tasks.alertmanager"]
          type: A
          port: 9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CPU, mémoire, réseau de chaque conteneur, sur chaque nœud
  - job_name: cadvisor
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080

  # CPU, mémoire, disque de chaque nœud
  - job_name: node-exporter
    dns_sd_configs:
      - names: ["tasks.node-exporter"]
        type: A
        port: 9100

  # Consommation de chaque établissement (port interne de l'API)
  - job_name: api
    dns_sd_configs:
      - names: ["tasks.api"]
        type: A
        port: 9464

  # Requêtes HTTP par site (portail, API, Moodle de chaque établissement)
  - job_name: traefik
    dns_sd_configs:
      - names: ["tasks.traefik"]
        type: A
        port: 8082

  # Alertmanager lui-même (notifications envoyées ou en échec)
  - job_name: alertmanager
    dns_sd_configs:
      - names: ["tasks.alertmanager"]
        type: A
        port: 9093
