services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharedmoodle
      POSTGRES_USER: smadmin
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smadmin -d sharedmoodle"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: portal/backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://smadmin:devpassword@postgres:5432/sharedmoodle
      JWT_SECRET: local-development-secret-change-me
      DOMAIN: localhost
      FRONTEND_ORIGINS: http://localhost:8080
      PROVISIONING_MODE: simulate
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./portal/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-dev-data:
